blueprint:
  name: HM-Sec-SC-2 – Licht bei Öffnen (mit Timer)
  description: Schaltet ein Licht ein, wenn ein beliebiger binary_sensor auf "on" geht – und nach Ablauf wieder aus.
  domain: automation

  input:
    contact_sensor:
      name: Sensor (binary_sensor)
      description: Wähle den Tür-/Fensterkontakt oder beliebigen binary_sensor.
      selector:
        entity:
          domain: binary_sensor

    light_entity:
      name: Licht
      description: Das Licht, das eingeschaltet werden soll.
      selector:
        entity:
          domain: light

    light_duration:
      name: Lichtdauer in Sekunden
      description: Wie lange soll das Licht an bleiben?
      default: 60
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
          mode: slider

mode: restart

trigger:
  - platform: state
    entity_id: !input contact_sensor
    to: "on"

action:
  - service: light.turn_on
    target:
      entity_id: !input light_entity

  - delay:
      seconds: !input light_duration

  - service: light.turn_off
    target:
      entity_id: !input light_entity
